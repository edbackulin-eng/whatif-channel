name: Guarantee today's video

# One-off safety net for 15 October: watches the running build and makes sure an
# episode is scheduled for TODAY. If the build uploads, its publishAt is moved to
# today when it is not. If there is no upload by the deadline, the build is
# cancelled (so it cannot upload a duplicate later) and episode 002 from the 13
# October build is uploaded for today instead.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the build run to watch
        required: true
      artifact_id:
        description: artifact holding the fallback package
        required: true
      deadline:
        description: HH:MM UTC to fall back at
        default: "14:00"

permissions:
  contents: write
  actions: write

jobs:
  guarantee:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Watch, and step in at the deadline
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          git config user.name "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          python -X utf8 tools/watch_today.py "${{ inputs.run_id }}" \
            ready/2026-10-13/002-what-if-earth-stopped-spinning "${{ inputs.deadline }}"
