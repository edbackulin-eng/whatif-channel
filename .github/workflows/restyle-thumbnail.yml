name: Restyle a thumbnail

# Gives an episode that already exists a thumbnail in the new house style: a face
# in the foreground carrying the emotion, the event behind it, one to three
# enormous words. New episodes get one from the build itself - the candidates
# ride along on the scene batch - so this is only for episodes built before the
# style changed.
#
# Every slug in one run shares a single GPU kernel, so restyling five episodes
# costs about what one costs. Replacing the thumbnail on the live video is opt-in
# and off by default: without it the run only produces files.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Queue slugs, space separated"
        required: true
      set_youtube:
        description: "Also replace the thumbnail on the live video"
        type: boolean
        default: false

concurrency:
  group: thumbnails
  cancel-in-progress: false

# Write, because the lines a thumbnail used are recorded in its queue entry so
# that the next episode does not repeat them. Nothing else here is committed.
permissions:
  contents: write

jobs:
  # The shared Kaggle account belongs to Closed Tabs from 20:00 UTC. A restyle
  # may wait up to 90 minutes for a busy GPU before it submits, so one that
  # starts after 17:30 could still be on the GPU at 20:00. It stops here, green,
  # and is run again in the next window.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.clock.outputs.go }}
    steps:
      - id: clock
        run: |
          m=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          if [ "$m" -lt $((17 * 60 + 30)) ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "it is $(date -u +%H:%M) UTC, past 17:30; outside What If's GPU window"; fi

  restyle:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180          # the GPU queue is the whole of this wait
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restyle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Only read when the input below asks for it, but the step needs it in
          # scope either way.
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          # Through the environment, not interpolated into the script: an input
          # pasted straight into a shell line is a command the runner would run.
          SLUGS: ${{ github.event.inputs.slugs }}
          SET_YOUTUBE: ${{ github.event.inputs.set_youtube }}
        run: |
          args=""
          for s in $SLUGS; do args="$args --slug $s"; done
          if [ "$SET_YOUTUBE" = "true" ]; then args="$args --set-youtube"; fi
          python -X utf8 tools/restyle_thumbnail.py $args

      # Only the lines each thumbnail used, so the next episode does not repeat
      # them. Lost otherwise: the runner is thrown away.
      - name: Record the lines used
        if: always()
        run: |
          git config user.name  "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add queue/
          git commit -m "thumbnails: lines used by $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push && exit 0
            sleep $((i * 8))
          done
          echo "::warning::the lines used could not be pushed; a later thumbnail may repeat them"

      # The thumbnails themselves are not committed: queue/*/*.png is ignored,
      # because this repository holds code and text and nothing heavy.
      - name: Upload the thumbnails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thumbnails
          path: |
            output/thumbnails/*/thumbnail.png
            output/thumbnails/*/thumbnail_browse.png
            output/thumbnails/*/thumbnail_report.json
            output/thumbnails/*/thumbnail_brief.json
            output/thumbnails/*/candidate_*.png
          retention-days: 14
          if-no-files-found: error
