name: watchdog

# Every hour on an odd minute. Reruns a build that failed before its upload,
# starts one when fewer than two episodes are scheduled (before 18:00 UTC), moves
# a later episode onto a slot about to go empty, emails the owner about what it
# cannot fix, and commits its state daily so the schedules never lapse.
# See automation/watchdog.py.
on:
  schedule:
    - cron: "11,41 * * * *"       # twice an hour: GitHub drops many scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Watch, every 15 minutes, then hand over to the next run
        run: |
          # GitHub runs schedules unreliably (twice in nine hours on 18.10), so
          # one run checks every 15 minutes for almost six hours and then starts
          # its successor; the schedule only restarts the chain if it breaks.
          git config user.name "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          end=$(( $(date +%s) + 5*3600 + 40*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            python -X utf8 automation/watchdog.py > "$RUNNER_TEMP/out.txt" 2>&1 || true
            tail -40 "$RUNNER_TEMP/out.txt"
            commit=$(grep -o "^commit=.*" "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2)
            git add state/watchdog.json queue/*/episode.json
            [ "$commit" = "true" ] && git add state/heartbeat.json
            if ! git diff --cached --quiet; then
              git commit -q -m "watchdog: state $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 8)); done
            fi
            : > "$GITHUB_OUTPUT"
            sleep 900
          done
          gh workflow run watchdog.yml --repo ${{ github.repository }}
