name: watchdog

# Every hour on an odd minute. Reruns a build that failed before its upload,
# starts one when fewer than two episodes are scheduled (before 18:00 UTC), moves
# a later episode onto a slot about to go empty, emails the owner about what it
# cannot fix, and commits its state daily so the schedules never lapse.
# See automation/watchdog.py.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Watch
        id: watch
        run: python -X utf8 automation/watchdog.py
      - name: Commit the state
        if: always()
        run: |
          git config user.name "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add state/watchdog.json queue/*/episode.json
          [ "${{ steps.watch.outputs.commit }}" = "true" ] && git add state/heartbeat.json
          git diff --cached --quiet && exit 0
          git commit -m "watchdog: state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 8)); done
          exit 1
