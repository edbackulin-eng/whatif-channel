name: Build the next video

# Mon, Tue, Thu, Fri, Sat. Takes the oldest ready script from the queue and
# renders it, uploads it private with a publishAt on the nearest free slot, and
# keeps at least two episodes scheduled ahead (it builds the NEXT episode, never
# "today's"). No language model is called here: the script is already written
# and fact-checked, so a bad day at any provider cannot cost an upload.
on:
  schedule:
    # 03:17, an early odd minute. GitHub starts scheduled runs late - up to eight
    # hours on this repository - and a build takes about three and a half, so a
    # 06:00 trigger regularly landed after the 15:00 slot it was meant to feed.
    # The minute is odd because the top of the hour is where the queue is longest.
    - cron: "17 3 * * 1,2,4,5,6"
  workflow_dispatch:
    inputs:
      slug:
        description: "Build a specific episode slug instead of the next one"
        required: false

concurrency:
  group: video-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330          # GPU wait + render; the free ceiling is 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The queue used to be topped up only on Sundays. A week with two scripts
      # in stock left Saturday 17 October without a video. Now a build that finds
      # fewer than three ready writes more before it picks one.
      - name: Is the queue thin
        id: depth
        run: python -X utf8 automation/queue_status.py --min-ready 3

      - name: Wait for a running script-writer
        if: steps.depth.outputs.needs_scripts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two writers at once would pick the same unused topics.
          for i in $(seq 1 60); do
            n=$(gh run list --workflow write-scripts.yml --status in_progress --json databaseId --jq length)
            q=$(gh run list --workflow write-scripts.yml --status queued --json databaseId --jq length)
            [ "$n" = "0" ] && [ "$q" = "0" ] && exit 0
            echo "script-writer is running, waiting ($i/60)"; sleep 60
          done
          echo "::warning::script-writer still running after an hour; carrying on"

      - name: Refresh the queue after the wait
        if: steps.depth.outputs.needs_scripts == 'true'
        run: git pull --rebase -q origin "${{ github.ref_name }}" || true

      - name: Is it still thin
        id: depth2
        if: steps.depth.outputs.needs_scripts == 'true'
        run: python -X utf8 automation/queue_status.py --min-ready 3

      - name: Install Claude CLI
        if: steps.depth2.outputs.needs_scripts == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write scripts into the queue
        if: steps.depth2.outputs.needs_scripts == 'true'
        # A failure here must not cost the day's video: the build below still
        # takes whatever is ready.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -X utf8 automation/write_scripts.py --count 5
          git config user.name  "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add queue/
          git commit -m "queue: top-up before build $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push && exit 0
            sleep $((i * 8))
          done
          echo "::warning::the new scripts could not be pushed"

      - name: Check the queue
        id: queue
        run: python -X utf8 automation/queue_status.py --for-build

      # Found broken after the fact once already: a build rendered for three and
      # a half hours and then had nothing to upload with. Ten seconds up front.
      - name: Prove the YouTube credentials
        if: steps.queue.outputs.has_work == 'true' && vars.YOUTUBE_ENABLED == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python -X utf8 automation/upload_youtube.py --check

      - name: Fetch voice model
        if: steps.queue.outputs.has_work == 'true'
        run: python -X utf8 automation/fetch_models.py

      - name: Cache the music tracks
        if: steps.queue.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: assets/music/*.mp3
          key: music-${{ hashFiles('assets/music/library.json') }}

      - name: Fetch the music tracks
        if: steps.queue.outputs.has_work == 'true'
        run: python -X utf8 automation/fetch_music.py

      - name: Build
        if: steps.queue.outputs.has_work == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -X utf8 automation/build_next.py --slug "${{ github.event.inputs.slug }}"

      - name: Upload the package
        if: steps.queue.outputs.has_work == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: episode-${{ steps.queue.outputs.slug }}
          path: ready/
          retention-days: 3
          if-no-files-found: error

      # Uploading does not wait for an audit. A sibling channel publishes
      # through the API from an unaudited project and its videos go public on
      # schedule, so the gate is simply whether credentials are configured.
      - name: Upload to YouTube
        id: upload
        if: steps.queue.outputs.has_work == 'true' && vars.YOUTUBE_ENABLED == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python -X utf8 automation/upload_youtube.py

      - name: Record the outcome
        if: always()
        run: |
          git config user.name  "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add queue/ || true
          git commit -m "build: $(date -u +%Y-%m-%d) ${{ steps.queue.outputs.slug }}" || exit 0
          # "git push || true" swallowed a rejected push, so the record that
          # episode 002 was rendered never reached the repository and the next
          # build would have rendered it all over again. Retry on a fresh base,
          # and fail the step if it still cannot be saved.
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push && exit 0
            sleep $((i * 8))
          done
          echo "::error::the build record could not be pushed; the next build may repeat this episode"
          exit 1

      - name: Count what is scheduled ahead
        id: stock
        if: always()
        run: |
          git pull --rebase -q origin "${{ github.ref_name }}" || true
          python -X utf8 automation/buffer.py --min 2

      # At least two uploaded and scheduled at all times. A run that leaves fewer
      # starts the next one itself, so the stock is rebuilt without waiting for
      # the next cron. It only chains after a successful upload, so a failure
      # cannot loop; with nothing ready to build, or an upload that failed, the
      # shortfall is an error and the run goes red.
      - name: Keep two scheduled ahead
        if: always() && steps.stock.outputs.short == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ] && [ "${{ steps.stock.outputs.ready }}" != "0" ]; then
            echo "only ${{ steps.stock.outputs.ahead }} scheduled ahead; starting the next build"
            gh workflow run build-video.yml --repo "${{ github.repository }}"
          else
            echo "::error::only ${{ steps.stock.outputs.ahead }} episode(s) scheduled ahead, and this run cannot build another (upload: ${{ steps.upload.outcome }}, scripts ready: ${{ steps.stock.outputs.ready }})"
            exit 1
          fi
