name: Build the next video

# Mon, Tue, Thu, Fri, Sat. Takes the oldest ready script from the queue and
# renders it. No language model is called here: the script is already written
# and fact-checked, so a bad day at any provider cannot cost an upload.
on:
  schedule:
    - cron: "0 6 * * 1,2,4,5,6"
  workflow_dispatch:
    inputs:
      slug:
        description: "Build a specific episode slug instead of the next one"
        required: false

concurrency:
  group: video-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # GPU wait + render; the free ceiling is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the queue
        id: queue
        run: python -X utf8 automation/queue_status.py --for-build

      - name: Fetch voice model
        if: steps.queue.outputs.has_work == 'true'
        run: python -X utf8 automation/fetch_models.py

      - name: Build
        if: steps.queue.outputs.has_work == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -X utf8 automation/build_next.py --slug "${{ github.event.inputs.slug }}"

      - name: Upload the package
        if: steps.queue.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.queue.outputs.slug }}
          path: ready/
          retention-days: 3
          if-no-files-found: error

      # Once the YouTube API audit is approved, set the repository variable
      # YOUTUBE_AUDIT_APPROVED to "true" and this step uploads directly instead
      # of leaving the package sitting in an artifact.
      - name: Upload to YouTube
        if: steps.queue.outputs.has_work == 'true' && vars.YOUTUBE_AUDIT_APPROVED == 'true'
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -X utf8 automation/upload_youtube.py

      - name: Record the outcome
        if: always()
        run: |
          git config user.name  "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add queue/ || true
          git commit -m "build: $(date -u +%Y-%m-%d) ${{ steps.queue.outputs.slug }}" || exit 0
          git push || true
