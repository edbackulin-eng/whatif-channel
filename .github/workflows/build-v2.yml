name: Build a video (v2)

# Owner 15.11: the new What If - global catastrophes as a timeline of consequences, real video at least
# half the film, Blender 3D (Earth with NASA Blue/Black Marble, the Sun, the Moon, an asteroid, orbits,
# the ocean), animated maps and cards, FLUX at most a fifth, sound effects under the scenes, thumbnails
# after the niche's leader. Three jobs: prep (needs What If's Kaggle window for FLUX), the 3D shots in
# parallel, then the montage, QA and the upload.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Queue slug to build"
        required: true
      upload:
        description: "Upload to YouTube on the next free slot when QA passes"
        type: boolean
        default: false
      prep_run:
        description: "Reuse the prep of this earlier run (its id): only the 3D shots and the montage again"
        required: false
        default: ""
      no_flux:
        description: "A dry run outside What If's Kaggle window: FLUX shots become 3D, no thumbnails"
        type: boolean
        default: false
      flux_only:
        description: "With prep_run: only FLUX and the thumbnails again on that prep (Kaggle window), then 3D and montage"
        type: boolean
        default: false
  # a booked trial (state/v2_trial.txt: the slug) starts early enough for FLUX to land in the GPU window
  # (07:00-17:30 UTC); the booking is claimed (deleted and pushed) before the build, so it runs once
  schedule:
    - cron: "35 5 * * *"
    - cron: "5 6 * * *"

concurrency:
  group: video-build-v2
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.g.outputs.go }}
      slug: ${{ steps.g.outputs.slug }}
      upload: ${{ steps.g.outputs.upload }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SLUG_IN: ${{ github.event.inputs.slug }}
          UPLOAD: ${{ github.event.inputs.upload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stop() { echo "go=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }
          git config user.name "whatif-bot"; git config user.email "noreply@users.noreply.github.com"
          if [ "$EVENT" = "schedule" ] && [ -s state/v2_trial.txt ]; then
            # a booked trial: uploaded too once v2 is switched on (owner 17.11: "work by the schedule")
            SLUG_IN="$(head -1 state/v2_trial.txt | tr -d '[:space:]')"
            UPLOAD=$(python3 -c "import json;print('true' if json.load(open('config.json')).get('v2_ready') else 'false')")
            git rm -q state/v2_trial.txt && git commit -qm "v2 trial claimed: $SLUG_IN" && git push -q || stop "the claim did not push"
          elif [ "$EVENT" = "schedule" ] || [ "$SLUG_IN" = "next" ]; then
            # the automation (owner 16.11): two videos in reserve; one build at a time; the next v2 script
            [ "$(python3 -c "import json;print(bool(json.load(open('config.json')).get('v2_ready')))")" = "True" ] || stop "v2 is not switched on yet"
            n=$(gh run list -R "${{ github.repository }}" --workflow build-v2.yml --json status,databaseId --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
            [ "$n" = "0" ] || stop "a v2 build is already running"
            # owner 17.11: no new episode while one is held by QC - it is fixed first
            held=$(python3 -X utf8 -c "import sys;sys.path.insert(0,'.');from pipeline import queue;print(' '.join(e['slug'] for e in queue.episodes() if e.get('engine')=='v2' and e.get('held_by_qc') and not e.get('youtube_id')))")
            [ -z "$held" ] || stop "held by QC, fixed first: $held"
            ahead=$(python3 -X utf8 -c "import sys;sys.path.insert(0,'.');from automation import buffer;print(buffer.ahead())")
            [ "${ahead:-0}" -lt 2 ] || stop "$ahead scheduled ahead: enough"
            SLUG_IN=$(python3 -X utf8 -c "import sys;sys.path.insert(0,'.');from pipeline import queue;e=queue.next_episode();print(e['slug'] if e else '')")
            [ -n "$SLUG_IN" ] || stop "no v2 script ready in the queue"
            UPLOAD=true
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG_IN" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD:-false}" >> "$GITHUB_OUTPUT"
          echo "building $SLUG_IN, upload ${UPLOAD:-false}"

  prep:
    needs: gate
    if: needs.gate.outputs.go == 'true' && (github.event.inputs.prep_run == '' || github.event.inputs.flux_only == 'true')
    env:
      SLUG: ${{ needs.gate.outputs.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python -X utf8 automation/fetch_models.py
      - uses: actions/cache@v4
        with:
          path: assets/music/*.mp3
          key: music-${{ hashFiles('assets/music/library.json') }}
      - run: python -X utf8 automation/fetch_music.py
      - uses: actions/cache@v4
        with:
          path: assets/textures
          key: nasa-textures-v1
      - run: python -X utf8 tools/v2_assets.py textures
      - if: github.event.inputs.flux_only == 'true'
        uses: actions/download-artifact@v5
        with:
          name: v2-prep
          path: .
          run-id: ${{ github.event.inputs.prep_run }}
          github-token: ${{ github.token }}
      - name: Narration, shots, real video, cards, FLUX, thumbnails
        env:
          FLUX_ONLY: ${{ github.event.inputs.flux_only }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          V2_NO_FLUX: ${{ github.event.inputs.no_flux == 'true' && '1' || '' }}
        run: |
          if [ "$FLUX_ONLY" = "true" ]; then
            # What If's Kaggle window is 07:00-17:30 UTC (Closed Tabs has the GPU from 20:00)
            m=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
            if [ "$m" -lt 420 ]; then echo "waiting for 07:00 UTC"; sleep $(( (420 - m) * 60 )); fi
            m=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
            [ "$m" -lt 1050 ] || { echo "::error::outside What If's Kaggle window (07:00-17:30 UTC)"; exit 1; }
            python -X utf8 automation/stages_v2.py flux --slug "$SLUG"
          else
            python -X utf8 automation/stages_v2.py prep --slug "$SLUG"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: v2-prep
          path: |
            output/${{ needs.gate.outputs.slug }}/
            state/used_footage.json
          retention-days: 3
          compression-level: 0

  blender:
    needs: [gate, prep]
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' && contains(fromJSON('["success","skipped"]'), needs.prep.result) }}
    env:
      SLUG: ${{ needs.gate.outputs.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0
      - run: pip install -q pillow numpy
      - uses: actions/download-artifact@v5
        with:
          name: v2-prep
          path: .
          run-id: ${{ (github.event.inputs.prep_run != '' && github.event.inputs.flux_only != 'true') && github.event.inputs.prep_run || github.run_id }}
          github-token: ${{ github.token }}
      - id: blender_cache
        uses: actions/cache/restore@v4
        with:
          path: tools/blender
          key: blender-4.2.3
      - run: python -X utf8 tools/v2_assets.py blender
      # saved at once, not at the job's end: a render that fails must not cost the next run the download
      - if: steps.blender_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/blender
          key: blender-4.2.3
      - uses: actions/cache@v4
        with:
          path: assets/textures
          key: nasa-textures-v1
      - run: python -X utf8 tools/v2_assets.py textures
      - name: 3D shots, share ${{ matrix.k }} of 8
        run: |
          rm -f output/$SLUG/v2/clips/*.mp4
          python -X utf8 automation/stages_v2.py blender --slug "$SLUG" --k ${{ matrix.k }} --n 8
      - uses: actions/upload-artifact@v5
        with:
          name: v2-3d-${{ matrix.k }}
          path: output/${{ needs.gate.outputs.slug }}/v2/clips/
          retention-days: 3
          if-no-files-found: ignore

  assemble:
    needs: [gate, prep, blender]
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' && contains(fromJSON('["success","skipped"]'), needs.prep.result) }}
    env:
      SLUG: ${{ needs.gate.outputs.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: assets/music/*.mp3
          key: music-${{ hashFiles('assets/music/library.json') }}
      - run: python -X utf8 automation/fetch_music.py
      - uses: actions/cache@v4
        with:
          path: assets/textures
          key: nasa-textures-v1
      - run: python -X utf8 tools/v2_assets.py textures
      - uses: actions/download-artifact@v5
        with:
          name: v2-prep
          path: .
          run-id: ${{ (github.event.inputs.prep_run != '' && github.event.inputs.flux_only != 'true') && github.event.inputs.prep_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          pattern: v2-3d-*
          merge-multiple: true
          path: output/${{ needs.gate.outputs.slug }}/v2/clips/
      - name: Montage, sound, QA, package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -X utf8 automation/stages_v2.py assemble --slug "$SLUG"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: v2-package
          path: ready/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload to YouTube
        if: needs.gate.outputs.upload == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 automation/upload_youtube.py
      - name: Record the outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "whatif-bot"
          git config user.email "noreply@users.noreply.github.com"
          # one path at a time (17.11: `git add a b || true` adds nothing when b is missing); a conflict in
          # queue/ keeps this run's own lines (-X theirs while rebasing them), the journal is a union
          for f in queue state/used_footage.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "build v2: $(date -u +%Y-%m-%d) $SLUG"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs -q origin "${{ github.ref_name }}"; then git push -q && exit 0; else git rebase --abort || true; fi
            sleep $((i * 8))
          done
          python -X utf8 -c "import sys;sys.path.insert(0,'.');from core import ytguard;ytguard.notify('What If: the state of $SLUG could not be saved','${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')" || true
          exit 1
